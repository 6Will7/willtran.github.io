<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BART Tracker | Will Tran</title>
    <meta name="description" content="Real-time BART departures by station, line, and direction.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/variables.css?v=619d2a45">
    <link rel="stylesheet" href="/css/main.css?v=361157bf">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/loading.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/bart.css">
</head>
<body>
    <header>
  <div class="nav-container">
    <div class="brand-group">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
        <span class="toggle-icon">◐</span>
      </button>
      <a href="/" class="logo-link">William Tran<span class="logo-dot">.</span></a>
    </div>
    <nav>
      <ul>
        <li class="nav-quicklink"><a href="/gallery.html">Gallery</a></li>
        <li class="nav-quicklink"><a href="/stocks/">Stocks</a></li>
        <li class="nav-quicklink"><a href="/bart/">BART</a></li>
        <li><button type="button" id="jump-open" class="jump-open" aria-haspopup="dialog" aria-label="Open the all-pages menu">All pages <span class="jump-key" aria-hidden="true">⌘K</span></button></li>
      </ul>
    </nav>
  </div>
</header>

    <main class="container bart-wrap">
        <section class="section reveal">
            <h2>BART Tracker</h2>
            <p class="rest-sub">Real-time departures. Pick a station to see what's coming.</p>

            <div id="bart-alerts"></div>

            <div class="bart-picker">
                <input id="bart-search" type="text" placeholder="Search stations…" autocomplete="off" aria-label="Search stations">
                <div id="bart-station-list" class="bart-station-list" hidden></div>
            </div>
            <div id="bart-favs" class="bart-favs"></div>

            <div id="bart-board" hidden>
                <div class="bart-head">
                    <div>
                        <h3 id="bart-station-name"></h3>
                        <p id="bart-updated" class="bart-updated"></p>
                    </div>
                    <div class="bart-dir-filter" role="group" aria-label="Filter by direction">
                        <button class="mv-friend bart-dir active" data-dir="all">All</button>
                        <button class="mv-friend bart-dir" data-dir="North">North</button>
                        <button class="mv-friend bart-dir" data-dir="South">South</button>
                    </div>
                </div>
                <div id="bart-deps"></div>
            </div>
            <p id="bart-msg" class="mv-empty" role="status"></p>

            <div id="bart-map" aria-label="Map of BART stations"></div>
            <p class="bart-map-note">Tap a station on the map to see its departures.</p>

            <form id="bart-near-form" class="bart-near-form">
                <input id="bart-near-input" type="text" placeholder="Enter an address — find the closest rail stations" aria-label="Street address" autocomplete="off">
                <button type="submit" class="btn btn-primary">Find stations</button>
            </form>
            <div id="bart-near-results"></div>
        </section>
    </main>
    <footer>
  <div class="container">
    <p class="footer-links"><a href="/sitemap/">Sitemap</a> · <a href="/guestbook/">Guestbook</a></p>
    <p>&copy; <span id="current-year">2026</span> Will Tran. All rights reserved.</p>
  </div>
</footer>

    <script src="/js/main.js?v=fbe6bd86" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="/js/transit-data.js?v=e53e5aed" defer></script>
    <script src="/js/bart.js?v=160262b4" defer></script>
</body>
</html>
