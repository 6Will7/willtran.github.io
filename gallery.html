<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5">
    <meta name="description" content="Photo gallery — a collection of photographs by Will Tran. Click any photo to expand.">
    <title>Gallery | Will Tran</title>

    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- Shared Navigation Placeholder -->
    <div id="header-placeholder"></div>

    <main class="container">
        <section class="section reveal">
            <h2>Photographs</h2>
            <p>A collection of photos that I have taken. Click any photo to expand it.</p>

            <!-- Gallery Grid Container (rendered from DATA/gallery.json by js/gallery.js) -->
            <div id="gallery-container" aria-live="polite"></div>
        </section>
    </main>

    <!-- Shared Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightbox-close" aria-label="Close photo viewer">&times;</button>

        <div class="lightbox-container">
            <img class="lightbox-image" src="" alt="">

            <button class="lightbox-nav lightbox-prev" aria-label="Previous image">
                <span class="nav-arrow">&#10094;</span>
            </button>
            <button class="lightbox-nav lightbox-next" aria-label="Next image">
                <span class="nav-arrow">&#10095;</span>
            </button>
        </div>

        <div class="lightbox-info">
            <div class="lightbox-counter">
                <span class="current-photo">1</span> / <span class="total-photos">0</span>
            </div>
            <div class="lightbox-caption"></div>
            <div class="lightbox-controls-hint">
                Swipe or use arrow keys to navigate &middot; ESC to close
            </div>
        </div>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/gallery.js" defer></script>
</body>
</html>
