<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5">
    <title>Gallery | William Tran</title>
    
    <!-- Base styles for the institutional theme -->
    <link rel="stylesheet" href="style.css">
    
    <!-- ADD THIS LINE: Specific gallery and lightbox styles -->
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <!-- Shared Navigation -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-link">William Tran</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="Resume.pdf" target="_blank">Download My Resume</a></li>
                    <li><a href="recipes.html">Recipes</a></li>
                              </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="section">
            <h2>Photographs</h2>
            <p>A collection of photos that I have taken. You can click to expand!</p>
            
            <!-- Gallery Grid -->
            <div id="gallery-container"></div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <!-- Close button -->
        <button class="lightbox-close" aria-label="Close lightbox">✕</button>
        
        <!-- Image container -->
        <div class="lightbox-container">
            <img class="lightbox-image" src="" alt="">
            
            <!-- Navigation buttons -->
            <button class="lightbox-nav lightbox-prev" aria-label="Previous image">
                <span class="nav-arrow">❮</span>
            </button>
            <button class="lightbox-nav lightbox-next" aria-label="Next image">
                <span class="nav-arrow">❯</span>
            </button>
        </div>
        
        <!-- Caption and counter -->
        <div class="lightbox-info">
            <div class="lightbox-counter">
                <span class="current-photo">1</span> / <span class="total-photos">6</span>
            </div>
            <div class="lightbox-caption"></div>
            <div class="lightbox-controls-hint">
                Swipe to navigate • ESC to close
            </div>
        </div>
    </div>

    <script>
     // ===== CLOUDINARY CONFIGURATION =====
        const cloudName = "YOUR_CLOUD_NAME"; 
        const thumbSettings = "c_fill,w_600,h_600,f_auto,q_auto"; 
        const fullSettings = "f_auto,q_auto";

        // ===== PHOTO DATA (CATEGORIZED) =====
        // Group your photos into distinct sections here
        const gallerySections = [
            {
                categoryTitle: "Kyoto Heritage",
                items: [
                    {
                        filename: "v123456789/WNT00410.jpg", 
                        alt: "Kamo River in Kyoto",
                        caption: "Kamo River in Kyoto"
                    },
                    {
                        filename: "v123456789/WNT00456.jpg",
                        alt: "Kinkaku-ji in Kyoto",
                        caption: "Kinkaku-ji in Kyoto"
                    },
                    {
                        filename: "v123456789/WNT00649.jpg",
                        alt: "Kiyomizu-dera Temple in Kyoto",
                        caption: "Kiyomizu-dera Temple in Kyoto - founded in 780"
                    },
                    {
                        filename: "v123456789/WNT00665.jpg",
                        alt: "Kiyomizu-dera Temple in Kyoto",
                        caption: "Another angle of Kiyomizu-dera Temple"
                    }
                ]
            },
            {
                categoryTitle: "Castles & Signs",
                items: [
                    {
                        filename: "v123456789/WNT00825_1.jpg",
                        alt: "Himeji Castle",
                        caption: "The White Heron Castle. Made famous by James Bond."
                    },
                    {
                        filename: "v123456789/WNT01013.jpg",
                        alt: "Sign",
                        caption: "Lost in translation"
                    }
                ]
            },
            {
                categoryTitle: "Okinawa",
                items: [
                    {
                        filename: "v123456789/WNT01240.jpg",
                        alt: "Sea Turtles at Churaumi Aquarium",
                        caption: "Sea Turtles at Churaumi Aquarium in Okinawa"
                    },
                    {
                        filename: "v123456789/WNT01244.jpg",
                        alt: "Sign",
                        caption: "Famous crowd, famouser fish"
                    }
                ]
            }
        ];

        // ===== RENDER GALLERY & BUILD LIGHTBOX DATA =====
       // ===== RENDER GALLERY & BUILD LIGHTBOX DATA =====
        const galleryContainer = document.getElementById('gallery-container');
        
        // 1. Create the Jump Navigation Container at the very top
        const jumpNav = document.createElement('div');
        jumpNav.className = 'jump-nav';
        galleryContainer.appendChild(jumpNav);
        
        const allPhotosForLightbox = [];
        let globalIndex = 0;

        gallerySections.forEach(section => {
            // Create a URL-safe ID from the title (e.g., "Kyoto Heritage" -> "kyoto-heritage")
            const sectionId = section.categoryTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-');

            // 2. Add a button to the Jump Menu for this section
            const jumpLink = document.createElement('a');
            jumpLink.href = `#${sectionId}`;
            jumpLink.textContent = section.categoryTitle;
            jumpNav.appendChild(jumpLink);

            // 3. Create the Section Title (and attach the ID we just made)
            const sectionTitle = document.createElement('h3');
            sectionTitle.id = sectionId; // <-- This makes the jump link work!
            sectionTitle.textContent = section.categoryTitle;
            sectionTitle.style.marginTop = globalIndex === 0 ? "0" : "3rem";
            sectionTitle.style.borderBottom = "1px solid var(--color-border)";
            sectionTitle.style.paddingBottom = "0.5rem";
            galleryContainer.appendChild(sectionTitle);

            // 4. Create the Grid for this section
            const grid = document.createElement('div');
            grid.className = 'gallery-grid';

            // 5. Populate the Grid
            section.items.forEach(photo => {
                allPhotosForLightbox.push(photo);

                const thumbUrl = `https://res.cloudinary.com/${cloudName}/image/upload/${thumbSettings}/${photo.filename}`;
                
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.innerHTML = `
                    <img src="${thumbUrl}" alt="${photo.alt}" class="gallery-image" data-index="${globalIndex}" loading="lazy">
                    <div class="gallery-caption">${photo.caption}</div>
                `;
                grid.appendChild(galleryItem);
                globalIndex++;
            });

            galleryContainer.appendChild(grid);
        });

        // ===== LIGHTBOX FUNCTIONALITY =====
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.querySelector('.lightbox-image');
        const lightboxCaption = document.querySelector('.lightbox-caption');
        const currentPhotoSpan = document.querySelector('.current-photo');
        const totalPhotosSpan = document.querySelector('.total-photos');
        let currentIndex = 0;

        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;
        const SWIPE_THRESHOLD = 50;

        // Update the counter to reflect ALL photos across all sections
        totalPhotosSpan.textContent = allPhotosForLightbox.length;

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('gallery-image')) {
                currentIndex = parseInt(e.target.dataset.index);
                openLightbox();
            }
        });

        function openLightbox() {
            // Pull from the master flat list
            const photo = allPhotosForLightbox[currentIndex];
            const fullUrl = `https://res.cloudinary.com/${cloudName}/image/upload/${fullSettings}/${photo.filename}`;
            
            lightboxImage.src = fullUrl;
            lightboxCaption.textContent = photo.caption;
            currentPhotoSpan.textContent = currentIndex + 1;
            
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            lightbox.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function showImage(index) {
            if (index >= allPhotosForLightbox.length) currentIndex = 0;
            if (index < 0) currentIndex = allPhotosForLightbox.length - 1;
            openLightbox();
        }

        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

        document.querySelector('.lightbox-next').addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex++;
            showImage(currentIndex);
        });

        document.querySelector('.lightbox-prev').addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex--;
            showImage(currentIndex);
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.querySelector('.lightbox-container').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        document.querySelector('.lightbox-info').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // ===== TOUCH SWIPE GESTURES =====
        lightboxImage.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
        }, { passive: true });

        lightboxImage.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].clientX;
            touchEndY = e.changedTouches[0].clientY;
            
            const horizontalDistance = Math.abs(touchEndX - touchStartX);
            const verticalDistance = Math.abs(touchEndY - touchStartY);
            
            if (horizontalDistance > SWIPE_THRESHOLD && horizontalDistance > verticalDistance) {
                if (touchEndX < touchStartX) {
                    currentIndex++;
                    showImage(currentIndex);
                } else if (touchEndX > touchStartX) {
                    currentIndex--;
                    showImage(currentIndex);
                }
            }
        }, { passive: true });

        // ===== KEYBOARD NAVIGATION =====
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'ArrowRight') {
                currentIndex++;
                showImage(currentIndex);
            }
            if (e.key === 'ArrowLeft') {
                currentIndex--;
                showImage(currentIndex);
            }
            if (e.key === 'Escape') closeLightbox();
        });

        // ===== PREVENT DOUBLE-TAP ZOOM ON BUTTONS =====
        let lastTap = 0;
        ['lightbox-nav', 'lightbox-close'].forEach(className => {
            document.querySelectorAll('.' + className).forEach(button => {
                button.addEventListener('touchstart', (e) => {
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        e.preventDefault();
                    }
                    lastTap = now;
                }, { passive: false });
            });
        });
    </script>

</body>
</html>
