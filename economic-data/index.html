<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economic Data | Will Tran</title>
    <meta name="description" content="Upcoming U.S. economic releases — CPI, payrolls, FOMC, GDP — with forecasts, actuals, and previous values.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/variables.css?v=619d2a45">
    <link rel="stylesheet" href="/css/main.css?v=aafbea2b">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/loading.css">
    <link rel="stylesheet" href="/css/econ.css">
</head>
<body>
    <header>
  <div class="nav-container">
    <div class="brand-group">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
        <span class="toggle-icon">◐</span>
      </button>
      <a href="/" class="logo-link">William Tran<span class="logo-dot">.</span></a>
      <button type="button" id="jump-open" class="jump-open" aria-haspopup="dialog" aria-label="Open the site menu"><span class="jump-burger" aria-hidden="true">☰</span> Menu <span class="jump-key" aria-hidden="true">⌘K</span></button>
    </div>
    <nav>
      <ul>
        <li class="nav-quicklink"><a href="/gallery.html">Gallery</a></li>
        <li class="nav-quicklink"><a href="/stocks/">Stocks</a></li>
        <li class="nav-quicklink"><a href="/bart/">BART</a></li>
      </ul>
    </nav>
  </div>
</header>

    <main class="container econ-wrap">
        <section class="section reveal">
            <h2>Economic Data</h2>
            <p class="rest-sub">Upcoming U.S. economic releases — schedules and reported values from the St. Louis Fed.</p>

            <div id="econ-next" class="econ-next" hidden></div>

            <div class="econ-toolbar">
                <div class="econ-weeks">
                    <button id="econ-prev" class="btn btn-sm">&larr; Prev</button>
                    <button id="econ-this" class="btn btn-sm">This week</button>
                    <button id="econ-next-wk" class="btn btn-sm">Next &rarr;</button>
                </div>
                <div class="econ-filters" role="group" aria-label="Filter by impact">
                    <button class="mv-friend econ-filter active" data-impact="all">All</button>
                    <button class="mv-friend econ-filter" data-impact="high">High</button>
                    <button class="mv-friend econ-filter" data-impact="medium">Medium</button>
                    <button class="mv-friend econ-filter" data-impact="low">Low</button>
                </div>
            </div>
            <p id="econ-range" class="econ-range"></p>
            <div id="econ-days"></div>
            <p id="econ-msg" class="mv-empty" role="status"></p>
        </section>
    </main>
    <footer>
  <div class="container">
    <p class="footer-links"><a href="/sitemap/">Sitemap</a> · <a href="/guestbook/">Guestbook</a></p>
    <p>&copy; <span id="current-year">2026</span> Will Tran. All rights reserved.</p>
  </div>
</footer>

    <script src="/js/main.js?v=da52daa7" defer></script>
    <script src="/js/econ.js?v=9726aea5" defer></script>
</body>
</html>
